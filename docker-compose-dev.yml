services:
  database:
    image: mariadb:10.4
    container_name: bts-assetdb-database
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: asset_register
      MYSQL_ROOT_PASSWORD: developer
      MYSQL_USER: developer
      MYSQL_PASSWORD: developer
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 10s
      interval: 60s
      timeout: 5s
      retries: 3
    volumes: 
      - ./local/database:/var/lib/mysql
    restart: no

  mail:
    image: djfarrelly/maildev
    container_name: bts-assetdb-mail
    ports:
      - '8081:80'
      - '1025:25'
    restart: no

  database-web:
    image: phpmyadmin/phpmyadmin
    container_name: bts-assetdb-database-web
    ports:
      - '8080:80'
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_USER: developer
      PMA_PASSWORD: developer
    restart: no
  